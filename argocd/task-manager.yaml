apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: task-manager
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Ashwin1808/task-manager-gitops.git
    targetRevision: main
    path: helm/task-manager

  destination:
    server: https://kubernetes.default.svc
    namespace: task-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true