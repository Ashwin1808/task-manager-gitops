apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: task-manager-route
  namespace: task-manager

spec:
  parentRefs:
    - name: task-manager-gateway

  rules:

    - matches:
        - path:
            type: PathPrefix
            value: /api

      backendRefs:
        - name: task-manager-backend
          port: 8080

    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: task-manager-frontend
          port: 8080