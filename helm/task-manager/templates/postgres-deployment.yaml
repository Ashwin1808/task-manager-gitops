apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-postgres
  labels:
    app: task-manager-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: task-manager-postgres

  template:
    metadata:
      labels:
        app: task-manager-postgres

    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"

          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.service.port }}

          env:
            - name: POSTGRES_DB
              value: "{{ .Values.postgres.database }}"

            - name: POSTGRES_USER
              value: "{{ .Values.postgres.username }}"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-manager-postgres-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: task-manager-postgres-pvc
